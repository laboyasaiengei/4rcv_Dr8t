<script>

    var box = document.getElementById('boot-error');
    var msg = document.getElementById('boot-error-message');

      box.style.display = 'block';
      msg.textContent = (e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');

  });
</script>

// Firestoreのルールを「ログイン済みのみ許可」にするための最低限のログイン。
// 画面上にログインUIは出さず、開いたら自動で匿名サインインする。
function ensureSignedIn() {
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.auth) {
      reject(new Error("firebase.auth が読み込まれていません"));
      return;
    }
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        resolve(user);
      } else {
        firebase
          .auth()
          .signInAnonymously()
          .catch(reject);
      }
    }, reject);
  });
}

// 初回アクセス時だけ、モックデータをFirestoreに書き込む。
// meta/status ドキュメントの有無で「初回かどうか」を判定するので、
// 一度seedした後にユーザーが全部削除しても再投入はされない。
async function seedIfNeeded() {
  const flagRef = db.collection("meta").doc("status");
  const flagSnap = await flagRef.get();
  if (flagSnap.exists) return;

  const batch = db.batch();

  initialChemicals.forEach((c) => {
    const { id, ...rest } = c;
    batch.set(db.collection("chemicals").doc(id), rest);
  });

  initialWasteCategories.forEach((w) => {
    const { id, entries, ...rest } = w;
    batch.set(db.collection("wasteCategories").doc(id), rest);
    entries.forEach((e) => {
      const { id: entryId, ...entryRest } = e;
      batch.set(db.collection("wasteEntries").doc(entryId), { wasteId: id, ...entryRest });
    });
  });

  batch.set(flagRef, { seeded: true });
  await batch.commit();
}

// 化学式・物質名を表示用に整形する。
// 元素記号や閉じ括弧の直後の数字＝下付き（原子数）。
// それ以外（文字列の先頭・「・」の直後など）の数字＝水和物の係数などなので
// 通常サイズのまま（例：Cu(NO3)2・3H2O → Cu(NO₃)₂・3H₂O の「3」は下付きにしない）。
// 元素記号・閉じ括弧の直後の数字＝原子数（下付き）。
// 文字列先頭・「・」直後・スペース直後の数字＝水和物係数やモル比などの通常数字。
// 上付き（イオン価数 2+ / 3- など）にも対応。
// <sub>タグそのままだと視認性が低いので、独自のスタイル付きspanで表示する。
function renderFormula(text) {
  const nodes = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];

    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < text.length && /[0-9]/.test(text[j])) j++;
      const run = text.slice(i, j);
      const prevChar = i > 0 ? text[i - 1] : null;
      const nextChar = j < text.length ? text[j] : null;
      const isChargeSuperscript = nextChar === "+" || nextChar === "-" || nextChar === "−";
      const isSubscript = !!prevChar && /[A-Za-z)\]]/.test(prevChar) && !isChargeSuperscript;

      if (isSubscript) {
        nodes.push(
          <span key={i} style={{ fontSize: "0.72em", verticalAlign: "-0.28em", fontWeight: 700 }}>
            {run}
          </span>
        );
      } else {
        nodes.push(<span key={i}>{run}</span>);
      }
      i = j;
    } else if (ch === "+" || ch === "-" || ch === "−") {
      // イオン価数などの符号（数字の直後）は上付きで表示
      const prevChar = i > 0 ? text[i - 1] : null;
      const isCharge = !!prevChar && /[0-9]/.test(prevChar);
      nodes.push(
        <span
          key={i}
          style={isCharge ? { fontSize: "0.72em", verticalAlign: "0.5em", fontWeight: 700 } : undefined}
        >
          {ch}
        </span>
      );
      i++;
    } else {
      nodes.push(<span key={i}>{ch}</span>);
      i++;
    }
  }
  return nodes;
}

function stockRatio(stock) {
  return stock.capacity > 0 ? stock.amount / stock.capacity : 0;
}

function barColor(stock) {
  const r = stockRatio(stock);
  if (r <= 0.15) return C.danger;
  if (r <= 0.4) return C.amberDeep;
  return C.teal;
}

const STATUS_META = {
  full: { label: "FULL", sub: "未開封", color: C.tealDeep, bg: C.okBg },
  in_use: { label: "使用中", sub: "開封済み", color: C.ink, bg: "#E7EAE5" },
  empty: { label: "空", sub: "廃棄待ち", color: C.danger, bg: C.dangerBg },
};

function autoStatus(stock) {
  if (stock.amount <= 0) return "empty";
  if (stock.amount >= stock.capacity) return "full";
  return "in_use";
}

// 濃度(g/L)を直接入力した記録の集合から、合計使用量・合成濃度(g/L)を算出する
// ※必ず「同じ薬品(substanceName)」の記録同士に対して使うこと
function summarizeEntries(entries) {
  let totalVolumeMl = 0;
  let totalMassG = 0;
  entries.forEach((e) => {
    const massG = e.concentrationGL * (e.volumeMl / 1000);
    totalVolumeMl += e.volumeMl;
    totalMassG += massG;
  });
  const aggregateGL = totalVolumeMl > 0 ? totalMassG / (totalVolumeMl / 1000) : 0;
  return {
    totalVolumeMl: Math.round(totalVolumeMl * 100) / 100,
    aggregateGL: Math.round(aggregateGL * 1000) / 1000,
  };
}

// タンク内の記録を薬品(substanceName)ごとにグループ化する
function groupBySubstance(entries) {
  const map = new Map();
  entries.forEach((e) => {
    if (!map.has(e.substanceName)) map.set(e.substanceName, []);
    map.get(e.substanceName).push(e);
  });
  return Array.from(map.entries()).map(([substanceName, list]) => ({
    substanceName,
    entries: list,
    summary: summarizeEntries(list),
  }));
}

// 廃液コードの並び替え（A→B、数字が小さい順。同じ番号内では強/有→弱/無の順）
function compareWasteCode(a, b) {
  const parse = (code) => {
    const m = code.match(/^([A-Za-z])-(\d+)(.*)$/);
    if (!m) return { letter: code, num: 0, suffix: "" };
    return { letter: m[1], num: parseInt(m[2], 10), suffix: m[3] || "" };
  };
  const suffixRank = { 強: 0, 有: 0, 弱: 1, 無: 1, "": 0, ホ: 2 };
  const pa = parse(a.code);
  const pb = parse(b.code);
  if (pa.letter !== pb.letter) return pa.letter < pb.letter ? -1 : 1;
  if (pa.num !== pb.num) return pa.num - pb.num;
  const ra = suffixRank[pa.suffix] ?? 9;
  const rb = suffixRank[pb.suffix] ?? 9;
  return ra - rb;
}

function slugify(name) {
  return "loc_" + name.trim().toLowerCase().replace(/\s+/g, "_") + "_" + Math.random().toString(36).slice(2, 6);
}

    <div>

/* ------------------------------------------------------------------ */
/*  廃液・投入記録の追加ページ（日付・氏名・使用量・濃度g/Lは必須）           */
/*  lockedSubstanceName がある場合＝薬品ページから：薬品名は固定             */
/*  ない場合＝タンクページから：一覧にない薬品なので薬品名を直接入力          */
/* ------------------------------------------------------------------ */

function WasteEntryAddPage({ waste, lockedSubstanceName, onBack, onSave, onOpenCalc }) {
  const today = new Date().toISOString().slice(0, 10);
  const [date, setDate] = useState(today);
  const [personName, setPersonName] = useState("");
  const [substanceName, setSubstanceName] = useState("");
  const [concentrationGL, setConcentrationGL] = useState("");
  const [volumeMl, setVolumeMl] = useState("");

  const finalSubstanceName = lockedSubstanceName || substanceName.trim();
  const canSave = date && personName.trim() && finalSubstanceName && concentrationGL !== "" && volumeMl !== "";

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,
    borderRadius: 10,
    padding: "10px 13px",
    fontSize: 14.5,
    color: C.ink,
    fontFamily: "'Inter', sans-serif",
    boxSizing: "border-box",
  };

  const handleSave = () => {
    if (!canSave) return;
    onSave(waste.id, {
      id: "e_" + Date.now(),
      date,
      personName: personName.trim(),
      substanceName: finalSubstanceName,
      concentrationGL: parseFloat(concentrationGL),
      volumeMl: parseFloat(volumeMl),
    });
  };

  return (
    <div>
      <TopBar title="投入記録を追加" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          <div style={{ width: 8, height: 8, borderRadius: 4, background: waste.color }} />
          <span style={{ fontSize: 12.5, color: C.inkSoft }}>{waste.code}　{waste.name}</span>
        </div>

        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: C.okBg, border: `1px solid #C7DAD6`, borderRadius: 10, padding: "10px 13px", marginBottom: 20 }}>
          <Info size={15} color={C.tealDeep} style={{ marginTop: 1, flexShrink: 0 }} />
          <span style={{ fontSize: 12.5, color: C.tealDeep, lineHeight: 1.6 }}>
            濃度は <b>g/L</b> でご記入ください。日付・氏名・使用量・濃度(g/L)はすべて必須項目です。
          </span>
        </div>

        <SectionLabel>薬品名 {!lockedSubstanceName && <span style={{ color: C.danger }}>*</span>}</SectionLabel>
        {lockedSubstanceName ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.lockBg, border: `1px dashed ${C.line}`, borderRadius: 10, padding: "10px 13px", marginBottom: 16 }}>
            <Lock size={13} color={C.inkSoft} />
            <span style={{ fontSize: 14.5, fontWeight: 600, color: C.ink }}>{renderFormula(lockedSubstanceName)}</span>
          </div>
        ) : (
          <input
            style={{ ...inputStyle, marginBottom: 16 }}
            value={substanceName}
            onChange={(e) => setSubstanceName(e.target.value)}
            placeholder="廃棄する薬品名を入力"
          />
        )}

        <SectionLabel>日付 <span style={{ color: C.danger }}>*</span></SectionLabel>
        <input type="date" style={{ ...inputStyle, marginBottom: 16, fontFamily: "'IBM Plex Mono', monospace" }} value={date} onChange={(e) => setDate(e.target.value)} />

        <SectionLabel>氏名 <span style={{ color: C.danger }}>*</span></SectionLabel>
        <input style={{ ...inputStyle, marginBottom: 16 }} value={personName} onChange={(e) => setPersonName(e.target.value)} placeholder="記録者の氏名" />

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <SectionLabel>濃度（g/L） <span style={{ color: C.danger }}>*</span></SectionLabel>
          <button
            onClick={onOpenCalc}
            style={{ border: "none", background: "transparent", color: C.tealDeep, fontSize: 11.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 3, marginBottom: 8 }}
          >
            <Calculator size={12} /> 計算ツールを使う
          </button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.paper, border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "10px 13px", marginBottom: 16 }}>
          <input
            type="number"
            inputMode="decimal"
            value={concentrationGL}
            onChange={(e) => setConcentrationGL(e.target.value)}
            placeholder="0.0"
            style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 16, fontFamily: "'IBM Plex Mono', monospace", color: C.ink }}
          />
          <span style={{ fontSize: 13, color: C.inkSoft, fontWeight: 600 }}>g/L</span>
        </div>

        <SectionLabel>使用量（mL） <span style={{ color: C.danger }}>*</span></SectionLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.paper, border: `1.5px solid ${C.line}`, borderRadius: 10, padding: "10px 13px", marginBottom: 24 }}>
          <input
            type="number"
            inputMode="decimal"
            value={volumeMl}
            onChange={(e) => setVolumeMl(e.target.value)}
            placeholder="0"
            style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 16, fontFamily: "'IBM Plex Mono', monospace", color: C.ink }}
          />
          <span style={{ fontSize: 13, color: C.inkSoft, fontWeight: 600 }}>mL</span>
        </div>

        <button
          onClick={handleSave}
          disabled={!canSave}
          style={{ width: "100%", border: "none", background: canSave ? C.ink : "#B7C0BC", color: "#fff", fontSize: 15, fontWeight: 600, borderRadius: 12, padding: "13px", cursor: canSave ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          <Save size={16} /> 記録する
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  g/L 換算計算ツール（分子量・物質量・体積から濃度g/Lを算出）              */
/* ------------------------------------------------------------------ */

function ConcentrationCalcPage({ onBack }) {
  const [molarMass, setMolarMass] = useState("");
  const [mol, setMol] = useState("");
  const [volumeMl, setVolumeMl] = useState("");

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,
    borderRadius: 10,
    padding: "10px 13px",
    fontSize: 16,
    color: C.ink,
    fontFamily: "'IBM Plex Mono', monospace",
    boxSizing: "border-box",
  };

  const mm = parseFloat(molarMass);
  const n = parseFloat(mol);
  const v = parseFloat(volumeMl);
  const valid = !isNaN(mm) && !isNaN(n) && !isNaN(v) && v > 0;
  const massG = valid ? mm * n : null;
  const resultGL = valid ? Math.round(((massG / v) * 1000) * 1000) / 1000 : null;

  return (
    <div>
      <TopBar title="g/L 計算ツール" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: C.okBg, border: `1px solid #C7DAD6`, borderRadius: 10, padding: "10px 13px", marginBottom: 20 }}>
          <Info size={15} color={C.tealDeep} style={{ marginTop: 1, flexShrink: 0 }} />
          <span style={{ fontSize: 12.5, color: C.tealDeep, lineHeight: 1.6 }}>
            分子量・物質量(mol)・体積(mL) から、廃液記録に入力する濃度(g/L)を計算します。
          </span>
        </div>

        <SectionLabel>分子量（g/mol）</SectionLabel>
        <input
          type="number"
          inputMode="decimal"
          style={{ ...inputStyle, marginBottom: 16 }}
          value={molarMass}
          onChange={(e) => setMolarMass(e.target.value)}
          placeholder="例：40.00（NaOH）"
        />

        <SectionLabel>物質量（mol）</SectionLabel>
        <input
          type="number"
          inputMode="decimal"
          style={{ ...inputStyle, marginBottom: 16 }}
          value={mol}
          onChange={(e) => setMol(e.target.value)}
          placeholder="使用した物質量"
        />

        <SectionLabel>体積（mL）</SectionLabel>
        <input
          type="number"
          inputMode="decimal"
          style={{ ...inputStyle, marginBottom: 22 }}
          value={volumeMl}
          onChange={(e) => setVolumeMl(e.target.value)}
          placeholder="溶かした先の体積"
        />

        <div
          style={{
            background: valid ? C.tealDeep : C.lockBg,
            borderRadius: 14,
            padding: "20px 18px",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 12, color: valid ? "#fff" : C.inkSoft, opacity: valid ? 0.85 : 1, marginBottom: 6 }}>算出された濃度</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 30, color: valid ? "#fff" : C.inkSoft }}>
            {valid ? resultGL : "―"}
            <span style={{ fontSize: 15, fontWeight: 500 }}> g/L</span>
          </div>
        </div>
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 10, textAlign: "center" }}>
          この値を「投入記録を追加」の濃度(g/L)欄に入力してください
        </div>
      </div>
    </div>
  );
}

/*  質量記録ページ（使用後の質量を都度入力・グラム表記）                     */

function RecordMassPage({ chemical, onBack, onSave }) {
  const [mass, setMass] = useState("");
  const [note, setNote] = useState("");
  const [saved, setSaved] = useState(false);

  const today = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });

  const handleSave = () => {
    const value = parseFloat(mass);
    if (isNaN(value)) return;
    onSave(chemical.id, value, note);
    setSaved(true);
    setTimeout(() => setSaved(false), 1600);
    setMass("");
    setNote("");
  };

  return (
    <div>
      <TopBar title="使用量の記録" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 20 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, fontSize: 15, color: C.ink }}>{chemical.name}</div>
            <div style={{ marginTop: 5 }}>
              <FormulaTag formula={chemical.formula} size={11.5} />
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, color: C.inkSoft }}>現在庫</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, color: C.ink }}>{chemical.stock.amount} g</div>
          </div>
        </div>

        <SectionLabel>記録日</SectionLabel>
        <div style={{ fontSize: 14, color: C.inkSoft, marginBottom: 18 }}>{today}</div>

        <SectionLabel>今回使用した質量</SectionLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.paper, border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 6 }}>
          <input
            type="number"
            inputMode="decimal"
            value={mass}
            onChange={(e) => setMass(e.target.value)}
            placeholder="0.0"
            style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 20, fontFamily: "'IBM Plex Mono', monospace", color: C.ink }}
          />
          <span style={{ fontSize: 14, color: C.inkSoft, fontWeight: 600 }}>g</span>
        </div>
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 18 }}>
          記録すると残量に応じて使用状況（FULL／使用中／空）が自動で切り替わります
        </div>

        <SectionLabel>メモ（任意）</SectionLabel>
        <textarea
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder="使用目的・実験名など"
          rows={3}
          style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 14px", fontSize: 14, fontFamily: "'Inter', sans-serif", color: C.ink, resize: "none", marginBottom: 22, boxSizing: "border-box" }}
        />

        <button
          onClick={handleSave}
          disabled={!mass}
          style={{ width: "100%", border: "none", background: mass ? C.ink : "#B7C0BC", color: "#fff", fontSize: 15, fontWeight: 600, borderRadius: 12, padding: "13px", cursor: mass ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          <Save size={16} /> 在庫を更新する
        </button>

        {saved && (
          <div style={{ marginTop: 14, textAlign: "center", fontSize: 13, fontWeight: 600, color: C.tealDeep, background: C.okBg, borderRadius: 10, padding: "10px" }}>
            記録しました。在庫を更新しました。
          </div>
        )}
      </div>
    </div>
  );
}

  const [locationNote, setLocationNote] = useState("");

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
          {[...wasteCategories].sort(compareWasteCode).map((w) => {
            const active = wasteId === w.id;

                onClick={() => setWasteId(w.id)}
                style={{
                  textAlign: "left",
                  display: "flex",
                  alignItems: "center",

                  border: `1.5px solid ${active ? w.color : C.line}`,

/* ------------------------------------------------------------------ */
/*  アプリ本体                                                         */
/* ------------------------------------------------------------------ */

const TABS = [
  { key: "search", label: "検索", icon: Search },
  { key: "location", label: "場所", icon: MapPin },
  { key: "inventory", label: "在庫", icon: Package },
  { key: "waste", label: "廃液", icon: Trash2 },
];

function ChemStockApp() {
  const [chemicals, setChemicals] = useState([]);
  const [wasteMeta, setWasteMeta] = useState([]);
  const [wasteEntriesRaw, setWasteEntriesRaw] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fatalError, setFatalError] = useState(firebaseInitError ? String(firebaseInitError.message || firebaseInitError) : null);
  const [homeTab, setHomeTab] = useState("search");
  const [stack, setStack] = useState([{ view: "home" }]);

  // ログイン（匿名）→ 初回だけモックデータを流し込み → Firestore購読、の順で立ち上げる。
  // どこで失敗しても画面が真っ白にならないよう、必ずエラーを画面に出す。
  useEffect(() => {
    if (firebaseInitError) return;
    let unsubChem, unsubWaste, unsubEntries;
    let cancelled = false;

    ensureSignedIn()
      .then(() => seedIfNeeded())
      .then(() => {
        if (cancelled) return;
        unsubChem = db.collection("chemicals").onSnapshot(
          (snap) => {
            setChemicals(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            setLoading(false);
          },
          (err) => {
            console.error("chemicals subscription error", err);
            setFatalError("薬品データの取得に失敗しました：" + err.message);
            setLoading(false);
          }
        );
        unsubWaste = db.collection("wasteCategories").onSnapshot(
          (snap) => setWasteMeta(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (err) => {
            console.error("wasteCategories subscription error", err);
            setFatalError("廃液分類データの取得に失敗しました：" + err.message);
          }
        );
        unsubEntries = db.collection("wasteEntries").onSnapshot(
          (snap) => setWasteEntriesRaw(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (err) => {
            console.error("wasteEntries subscription error", err);
            setFatalError("廃液記録データの取得に失敗しました：" + err.message);
          }
        );
      })
      .catch((err) => {
        console.error("startup failed", err);
        if (!cancelled) {
          setFatalError("起動処理に失敗しました：" + (err.message || String(err)));
          setLoading(false);
        }
      });

    return () => {
      cancelled = true;
      if (unsubChem) unsubChem();
      if (unsubWaste) unsubWaste();
      if (unsubEntries) unsubEntries();
    };
  }, []);

  // wasteCategories（メタ情報）＋wasteEntries（投入記録）を、既存の画面コンポーネントが
  // 期待する「entries を内包したカテゴリ配列」の形に合成する
  const wasteCategories = useMemo(
    () => wasteMeta.map((w) => ({ ...w, entries: wasteEntriesRaw.filter((e) => e.wasteId === w.id) })),
    [wasteMeta, wasteEntriesRaw]
  );

  const current = stack[stack.length - 1];

  const push = (entry) => setStack((s) => [...s, entry]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));
  const goHome = (tab) => {
    setStack([{ view: "home" }]);
    if (tab) setHomeTab(tab);
  };

  const handleSaveMass = async (chemId, used) => {
    const chem = chemicals.find((c) => c.id === chemId);
    if (!chem) return;
    const newAmount = Math.max(0, +(chem.stock.amount - used).toFixed(2));
    await db.collection("chemicals").doc(chemId).update({ "stock.amount": newAmount });
  };

  const handleAddChemical = async ({ name, formula, locationName, locationNote, capacity, purpose, wasteId }) => {
    const existingLoc = chemicals.find((c) => c.location.name.trim() === locationName)?.location;
    const location = existingLoc || { id: slugify(locationName), name: locationName, note: locationNote || "" };
    const newId = "c_" + Date.now();
    await db
      .collection("chemicals")
      .doc(newId)
      .set({ name, formula, location, stock: { amount: capacity, capacity, unit: "g" }, purpose: purpose || "", wasteId });
    goHome("inventory");
  };

  const handleDeleteChemical = async (chem) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`「${chem.name}」を薬品一覧から削除しますか？`)) return;
    }
    await db.collection("chemicals").doc(chem.id).delete();
    pop();
  };

  const handleAddWasteEntry = async (wasteId, entry) => {
    const { id, ...rest } = entry;
    await db.collection("wasteEntries").doc(id).set({ wasteId, ...rest });
    const cat = wasteMeta.find((w) => w.id === wasteId);
    if (cat && !cat.tankStartDate) {
      await db.collection("wasteCategories").doc(wasteId).update({ tankStartDate: entry.date });
    }
    pop();
  };

  const handleDeleteWasteEntry = async (wasteId, entry) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`${entry.date}・${entry.personName}の記録（${entry.substanceName}）を削除しますか？`)) return;
    }
    await db.collection("wasteEntries").doc(entry.id).delete();
    pop();
  };

  const findChem = (id) => chemicals.find((c) => c.id === id);
  const findWaste = (id) => wasteCategories.find((w) => w.id === id);

  if (fatalError) {
    return (
      <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <style>{FONT_IMPORT}</style>
        <div style={{ maxWidth: 420, background: C.dangerBg, border: `1px solid ${C.danger}`, borderRadius: 14, padding: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.danger, fontWeight: 700, marginBottom: 8 }}>
            <AlertTriangle size={18} /> 読み込みエラー
          </div>
          <div style={{ fontSize: 13, color: C.ink, lineHeight: 1.7, wordBreak: "break-word" }}>{fatalError}</div>
          <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 12, lineHeight: 1.6 }}>
            多くの場合、Firestoreのセキュリティルールやプロジェクト設定が原因です。ブラウザの開発者ツール（コンソール）にも詳細が出ています。
          </div>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <style>{FONT_IMPORT}</style>
        <Spinner />
        <div style={{ color: C.inkSoft, fontSize: 13 }}>読み込み中…</div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", justifyContent: "center" }}>
      <style>{FONT_IMPORT}</style>
      <div style={{ width: "100%", maxWidth: 460, minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column" }}>
        {current.view === "home" && (
          <>
            <TopBar title="薬品在庫・廃液管理" />
            <HazardStripe height={4} />

            <div style={{ display: "flex", gap: 6, padding: "12px 16px 0 16px" }}>
              {TABS.map((t) => {
                const active = homeTab === t.key;
                const Icon = t.icon;
                return (
                  <button
                    key={t.key}
                    onClick={() => setHomeTab(t.key)}
                    style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "9px 4px", borderRadius: 10, border: "none", cursor: "pointer", background: active ? C.ink : "transparent", color: active ? "#fff" : C.inkSoft, fontSize: 11.5, fontWeight: 600, transition: "background 0.15s" }}
                  >
                    <Icon size={16} />
                    {t.label}
                  </button>
                );
              })}
            </div>

            <div style={{ flex: 1, overflowY: "auto" }}>
              {homeTab === "search" && <SearchTab chemicals={chemicals} onSelect={(c) => push({ view: "detail", id: c.id })} />}
              {homeTab === "location" && <LocationTab chemicals={chemicals} onOpenLocation={(loc) => push({ view: "location", loc })} />}
              {homeTab === "inventory" && (
                <InventoryTab
                  chemicals={chemicals}
                  onRecord={(c) => push({ view: "record", id: c.id })}
                  onAdd={() => push({ view: "addChemical" })}
                  onDelete={handleDeleteChemical}
                />
              )}
              {homeTab === "waste" && (
                <WasteTab
                  wasteCategories={wasteCategories}
                  onOpenWaste={(w) => push({ view: "waste", wasteId: w.id })}
                  onOpenCalc={() => push({ view: "calc" })}
                />
              )}
            </div>
          </>
        )}

        {current.view === "detail" && (
          <ChemicalDetail
            chemical={findChem(current.id)}
            waste={findWaste(findChem(current.id).wasteId)}
            onBack={pop}
            onOpenLocation={(loc) => push({ view: "location", loc })}
            onOpenWaste={(w) => push({ view: "waste", wasteId: w.id })}
            onRecord={(c) => push({ view: "record", id: c.id })}
            onDelete={handleDeleteChemical}
            onRecordWaste={(c, w) => push({ view: "wasteEntryAdd", wasteId: w.id, lockedSubstanceName: c.name })}
          />
        )}

        {current.view === "location" && (
          <LocationPage location={current.loc} chemicals={chemicals} onBack={pop} onSelectChemical={(c) => push({ view: "detail", id: c.id })} />
        )}

        {current.view === "waste" && (
          <WastePage
            waste={findWaste(current.wasteId)}
            onBack={pop}
            onOpenSubstance={(substanceName) => push({ view: "wasteSubstance", wasteId: current.wasteId, substanceName })}
            onAddOther={() => push({ view: "wasteEntryAdd", wasteId: current.wasteId })}
          />
        )}

        {current.view === "wasteSubstance" && (
          <WasteSubstancePage
            waste={findWaste(current.wasteId)}
            substanceName={current.substanceName}
            onBack={pop}
            onOpenEntry={(e) => push({ view: "wasteEntry", wasteId: current.wasteId, entryId: e.id })}
            onAddEntry={() => push({ view: "wasteEntryAdd", wasteId: current.wasteId, lockedSubstanceName: current.substanceName })}
          />
        )}

        {current.view === "wasteEntry" && (
          <WasteEntryPage
            waste={findWaste(current.wasteId)}
            entry={findWaste(current.wasteId).entries.find((e) => e.id === current.entryId)}
            onBack={pop}
            onDelete={handleDeleteWasteEntry}
          />
        )}

        {current.view === "wasteEntryAdd" && (
          <WasteEntryAddPage
            waste={findWaste(current.wasteId)}
            lockedSubstanceName={current.lockedSubstanceName}
            onBack={pop}
            onSave={handleAddWasteEntry}
            onOpenCalc={() => push({ view: "calc" })}
          />
        )}

        {current.view === "calc" && <ConcentrationCalcPage onBack={pop} />}

        {current.view === "record" && <RecordMassPage chemical={findChem(current.id)} onBack={pop} onSave={handleSaveMass} />}

        {current.view === "addChemical" && (
          <AddChemicalPage wasteCategories={wasteCategories} onBack={pop} onSave={handleAddChemical} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ChemStockApp />);
document.getElementById('boot-error').style.display = 'none';
